name: flutter_starter_kit
description: "This is a base project in Flutter designed as a template for
  future developments. It contains essential configurations and packages to
  quickly start new projects."
publish_to: "none"
version: 0.0.1

environment:
  sdk: ^3.6.0

workspace:
  - packages/core_network
  - packages/core_storage
  - packages/core_ui
  - packages/feature_home
  - packages/feature_onboarding
  - packages/feature_settings
  - packages/platform_media
  - packages/platform_session
  - packages/platform_theme

dependencies:
  animate_do: ^4.2.0
  core_network: ^0.0.1
  core_storage: ^0.0.1
  core_ui: ^0.0.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  feature_home: ^0.0.1
  feature_onboarding: ^0.0.1
  feature_settings: ^0.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_dotenv: ^5.2.1
  flutter_gen: ^5.10.0
  flutter_local_notifications: ^19.2.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  formz: ^0.8.0
  get_it: ^8.0.3
  go_router: ^15.1.3
  google_fonts: ^6.2.1
  hydrated_bloc: ^10.0.0
  image_picker: ^1.1.2
  intl: any
  introduction_screen: ^3.1.17
  path_provider: ^2.1.5
  platform_media: ^0.0.1
  platform_session: ^0.0.1
  platform_theme: ^0.0.1
  shimmer: ^3.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  change_app_package_name: ^1.4.0
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.0.1
  integration_test:
    sdk: flutter
  melos: ^7.0.0
  mocktail: ^1.0.4

melos:
  scripts:
    check-deps:
      description: Verifica la regla de dependencia entre paquetes
      run: dart run tool/check_deps.dart
    analyze:
      description: Analiza el app y todos los paquetes
      run: flutter analyze --no-pub
    test:
      description: Corre los tests del app y de cada paquete
      run: |
        flutter test --no-pub
        melos exec -c 1 --dir-exists=test -- flutter test --no-pub
    gen-l10n:
      description: Genera l10n en el app y en cada paquete con l10n.yaml
      run: |
        flutter gen-l10n
        melos exec -c 1 --file-exists=l10n.yaml -- flutter gen-l10n

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Flavors Environments
    - flavors/.env.dev
    - flavors/.env.staging
    - flavors/.env.prod
    # Assets
    - assets/app-icon/
    - assets/loaders/
    - assets/icon/
    - assets/images/


flutter_native_splash:
  color: "#03A9F4"
  color_dark: "#272727"
  image: "assets/app-icon/native_splash_icon.png"

  android_12:
    color: "#03A9F4"
    color_dark: "#272727"
    image: "assets/app-icon/native_splash_icon.png"
    # branding: "assets/app-icon/native_splash_icon.png"
